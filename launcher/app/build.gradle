plugins {
    id "com.android.application"
}

android {
    namespace "com.cleanhome.tv"
    compileSdk 34

    defaultConfig {
        applicationId "com.cleanhome.tv"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.recyclerview:recyclerview:1.3.2"
}
